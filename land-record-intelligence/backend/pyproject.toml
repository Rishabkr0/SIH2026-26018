[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bhulekh-backend"
version = "0.1.0"
description = "Backend for Bhu-Lekh Land Record System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.3", # required for asyncpg/SQLAlchemy
    "redis>=5.0.4",
    "minio>=7.2.7",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0"
]
