services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: bhulekh_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhulekh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhulekh_password}
      POSTGRES_DB: ${POSTGRES_DB:-bhulekh_db}
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/docker/volumes/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhulekh_user} -d ${POSTGRES_DB:-bhulekh_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bhulekh_net

  redis:
    image: redis:7-alpine
    container_name: bhulekh_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./infrastructure/docker/volumes/redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bhulekh_net

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: bhulekh_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./infrastructure/docker/volumes/minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bhulekh_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhulekh_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-bhulekh_user}:${POSTGRES_PASSWORD:-bhulekh_password}@postgres:5432/${POSTGRES_DB:-bhulekh_db}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=land-records
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    volumes:
      - ./backend:/app
    networks:
      - bhulekh_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhulekh_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["python", "-u", "-m", "app.workers.run_worker"]
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-bhulekh_user}:${POSTGRES_PASSWORD:-bhulekh_password}@postgres:5432/${POSTGRES_DB:-bhulekh_db}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=land-records
    volumes:
      - ./backend:/app
    networks:
      - bhulekh_net

networks:
  bhulekh_net:
    driver: bridge
